name: Hero Lab live patch engine
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'scripts/**'
      - 'tests/**'
      - 'state/**'
      - 'site/**'
      - '.github/workflows/live-patch.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live-patch-and-pages
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      new_count: ${{ steps.events.outputs.new_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Patch parser and validation unit tests
        run: python -m unittest discover -s tests -p 'test_patch_engine.py' -v
      - name: Poll official Blizzard notes / validate / rebuild
        run: python scripts/patch_engine.py
      - name: Verify generated JavaScript
        run: node scripts/check_html.cjs
      - name: Install Chromium for regression tests
        run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile browser regression gate
        run: python -m unittest discover -s tests -p 'test_browser_flows.py' -v
      - name: Count new changes
        id: events
        shell: bash
        run: |
          echo "new_count=$(python -c 'import json;print(len(json.load(open("state/new-events.json"))))')" >> "$GITHUB_OUTPUT"
      - name: Optional Discord patch notification
        env:
          PATCH_NOTIFICATION_WEBHOOK: ${{ secrets.PATCH_NOTIFICATION_WEBHOOK }}
        run: python scripts/notify_webhook.py
      - name: Commit reproducible patch state and static app
        shell: bash
        run: |
          git config user.name 'hero-lab-patch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/patch-state.json state/new-events.json site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh official patch snapshot [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  production-deploy:
    needs: verify-and-build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy validated static site
        id: deploy
        uses: actions/deploy-pages@v4
