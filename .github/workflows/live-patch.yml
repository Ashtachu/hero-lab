name: Hero Lab live patch engine
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'scripts/**'
      - 'tests/**'
      - 'state/**'
      - 'site/**'
      - '.github/workflows/live-patch.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live-patch-and-pages
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      new_count: ${{ steps.events.outputs.new_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Patch parser, provenance, and validation unit tests
        run: python -m unittest discover -s tests -p 'test_*engine.py' -v
      - name: Poll official Blizzard notes / validate / rebuild
        run: python scripts/patch_engine.py
      - name: Verify generated JavaScript
        run: |
          node scripts/check_html.cjs
          node --check site/trust-ui.js
          node --check site/hero-switch.js
          grep -q 'id="hero-switch-script"' site/index.html
          grep -q 'id="hero-switch-styles"' site/index.html
          grep -q 'id="compact-sidebar-styles"' site/index.html
          grep -q 'id="compact-topbar-styles"' site/index.html
          test -s site/compact-topbar.css
          grep -q 'id="workspace-v2-styles"' site/index.html
          grep -q 'id="workspace-v2-script"' site/index.html
          node --check site/workspace-v2.js
          test -s site/workspace-v2.css
          node --check site/learning-routes.js
          test -s site/learning-routes.css
          grep -q 'id="learning-routes-styles"' site/index.html
          grep -q 'id="learning-routes-script"' site/index.html
          node --check site/team-pick.js
          test -s site/team-pick.css
          grep -q 'id="team-pick-styles"' site/index.html
          grep -q 'id="team-pick-script"' site/index.html
      - name: Install Chromium for regression tests
        run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile browser regression gate
        run: python -m unittest discover -s tests -p 'test_browser_flows.py' -v
      - name: Count new changes
        id: events
        shell: bash
        run: |
          echo "new_count=$(python -c 'import json;print(len(json.load(open("state/new-events.json"))))')" >> "$GITHUB_OUTPUT"
      - name: Optional Discord patch notification
        env:
          PATCH_NOTIFICATION_WEBHOOK: ${{ secrets.PATCH_NOTIFICATION_WEBHOOK }}
        run: python scripts/notify_webhook.py
      - name: Commit reproducible patch state and static app
        shell: bash
        run: |
          git config user.name 'hero-lab-patch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/patch-state.json state/new-events.json site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh official patch snapshot [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  production-deploy:
    needs: verify-and-build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy validated static site
        id: deploy
        uses: actions/deploy-pages@v5

  pipeline-health:
    name: Monitor patch-pipeline health
    if: ${{ always() }}
    needs: [verify-and-build, production-deploy]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Alert on failure and acknowledge recovery
        uses: actions/github-script@v9
        env:
          VERIFY_RESULT: ${{ needs.verify-and-build.result }}
          DEPLOY_RESULT: ${{ needs.production-deploy.result }}
        with:
          retries: 2
          script: |
            const {owner, repo} = context.repo;
            const title = 'Hero Lab patch pipeline failure';
            const {data: items} = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const current = items.find(item => !item.pull_request && item.title === title);
            const verified = process.env.VERIFY_RESULT;
            const deployed = process.env.DEPLOY_RESULT;
            const healthy = verified === 'success' && deployed === 'success';
            const runUrl = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            if (!healthy) {
              const body = [
                '## Scheduled patch-pipeline attention required',
                '',
                'The latest automated Hero Lab run did not finish cleanly.',
                'The existing published website is kept in place; the freshness badge becomes overdue if successful checks stop.',
                '',
                '- Build / patch check: **' + verified + '**',
                '- Deployment: **' + deployed + '**',
                '- Failed run: ' + runUrl,
                '- Event: ' + context.eventName,
                '',
                'Open the run above and inspect the first failed step. This issue closes automatically after a successful run.'
              ].join('\n');
              if (current) {
                await github.rest.issues.update({owner,repo,issue_number:current.number,body});
                core.warning('Patch pipeline remains unhealthy: ' + runUrl);
              } else {
                await github.rest.issues.create({owner,repo,title,body,assignees:[owner]});
                core.warning('Created an assigned patch-pipeline failure issue: ' + runUrl);
              }
            } else if (current) {
              await github.rest.issues.createComment({
                owner,repo,issue_number:current.number,
                body:'Recovered: both build and Pages deployment passed. ' + runUrl
              });
              await github.rest.issues.update({
                owner,repo,issue_number:current.number,state:'closed',state_reason:'completed'
              });
              core.info('Resolved the previous patch-pipeline failure issue.');
            } else {
              core.info('Patch pipeline healthy. No open incident issue.');
            }
